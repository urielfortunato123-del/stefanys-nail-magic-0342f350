services:
  - type: web
    name: stefany-nail-magic
    runtime: node
    plan: free
    branch: main
    buildCommand: bun install --frozen-lockfile && bun run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: NITRO_PRESET
        value: node-server
      - key: NODE_VERSION
        value: 22.19.0
